name: "Fleet Assistant Connector"
description: "Fleet assistant connector"
version: "2026.04.03"
slug: "fleet_assistant_connector"
init: false
url: https://github.com/mjosorg/fleet-assistant-connector
hassio_api: true
#homeassistant_api: true
hassio_role: "manager"
#auth_api: true
ports:
  8321/tcp: 8321
privileged:
  - NET_ADMIN
map:
  - config:rw
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64

options:
  server:
    host: my.VPS.org
    port: 51820
    publickey: inputpublickeyfrommaster
    tunnelip: inputtunnelIP
    installation_id: Installation ID
    fleet_assistant_server_ip: Fleet Assistant Server IP

schema:
  server:
    host: str
    port: port
    publickey: str
    tunnelip: str
    installation_id: str
    fleet_assistant_server_ip: str
