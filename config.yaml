name: "Fleet Assistant Connector"
description: "Fleet assistant connector [DEV]"
version: "2026.08.04"
slug: "fleet_assistant_connector_dev"
init: false
url: https://github.com/mjosorg/fleet-assistant-connector
hassio_api: true
hassio_role: "manager"
ports:
  8321/tcp: 8321
privileged:
  - NET_ADMIN
map:
  - config:rw
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64

options:
  log_level: warning
  server:
    host: my.VPS.org
    port: 51820
    publickey: inputpublickeyfrommaster
    tunnelip: inputtunnelIP
    fleet_assistant_server_ip: Fleet Assistant Server IP

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  server:
    host: str
    port: port
    publickey: str
    tunnelip: str
    fleet_assistant_server_ip: str
